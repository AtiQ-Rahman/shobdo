<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 50% 0%, #11634b 0%, #0a3f30 45%, #062419 100%);
    font-family: "Inter", "Noto Sans", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .glow { position: absolute; inset: 0; background: radial-gradient(40% 35% at 85% 95%, rgba(79,198,154,.18), transparent 70%),
    radial-gradient(35% 30% at 8% 10%, rgba(255,241,184,.07), transparent 70%); }
  #win { position: absolute; left: 160px; top: 52px; width: 1600px; height: 900px; border-radius: 16px; overflow: hidden;
    background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); transform-origin: 50% 50%; }
  #win img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  #sel { position: absolute; z-index: 2; background: rgba(51,103,214,.38); transform-origin: 0 0; }
  #cursor { position: absolute; z-index: 4; left: 0; top: 0; width: 46px; height: 46px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .ripple { position: absolute; z-index: 3; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid #4fc69a; }
  #cap { position: absolute; left: 0; right: 0; top: 978px; text-align: center; font-size: 40px; font-weight: 650; letter-spacing: -.01em; }
  #cap span { display: inline-block; padding: 6px 4px; }
  #cap i { font-style: normal; color: #7fe0b8; }
  #step { position: absolute; left: 160px; top: 986px; font-size: 22px; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.5); }
  .card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .card .in { display: grid; justify-items: center; gap: 18px; }
  .logo { width: 150px; height: 150px; border-radius: 34px; background: #fff; display: grid; place-items: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .logo img { width: 112px; height: 112px; }
  .name { font-size: 132px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  .bn { font-family: "Noto Serif Bengali", "Noto Sans Bengali", serif; font-size: 46px; color: #7fe0b8; margin-top: -4px; }
  .tag { font-size: 40px; color: rgba(255,255,255,.86); max-width: 1200px; line-height: 1.3; }
  .url { font-size: 28px; color: rgba(255,255,255,.6); margin-top: 18px; font-family: ui-monospace, "DejaVu Sans Mono", monospace; }
  .pills { display: flex; gap: 14px; margin-top: 10px; }
  .pills span { font-size: 24px; font-weight: 600; padding: 8px 18px; border-radius: 999px; border: 1.5px solid rgba(127,224,184,.5); color: #c9f3e1; }
</style></head>
<body>
<div class="glow"></div>
<div id="win"><img id="a"><img id="b"><div id="sel"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5 4 19.5l4.6-4.3 3 6.6 3-1.4-3-6.4 6.3-.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<div id="step"></div>
<div id="cap"><span></span></div>
<div class="card" id="intro"><div class="in">
  <div class="logo"><img src="../../icons/icon128.png"></div>
  <div class="name">Shobdo</div>
  <div class="bn">শব্দ</div>
  <div class="tag">Bangla &amp; English meanings for any word,<br>right where you read.</div>
</div></div>
<div class="card" id="outro"><div class="in">
  <div class="logo"><img src="../../icons/icon128.png"></div>
  <div class="name">Shobdo</div>
  <div class="tag">Read slowly, understand deeply.</div>
  <div class="pills"><span>Webpages</span><span>PDFs</span><span>Saved pages</span><span>Highlights &amp; notes</span><span>Revision</span><span>Reading time</span></div>
  <div class="url">github.com/AtiQ-Rahman/shobdo</div>
</div></div>
<script>
const TL = window.TL; // set by the renderer
const $ = (id) => document.getElementById(id);
const BASE = 1600 / 1920, WW = 1600, WH = 900;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
function interp(keys, t) { // keys: [[t, ...vals]]
  if (!keys || !keys.length) return null;
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const [t1, ...b] = keys[i], [t0, ...a] = keys[i - 1];
    if (t <= t1) { const k = ease((t - t0) / Math.max(1e-6, t1 - t0)); return a.map((v, j) => v + (b[j] - v) * k); }
  }
  return keys[keys.length - 1].slice(1);
}
const imgs = {};
function src(name) { return "shots/" + name + ".png"; }
let ripples = [];

function setTime(T) {
  const sc = TL.scenes.find((s) => T >= s.start && T < s.start + s.dur) || TL.scenes[TL.scenes.length - 1];
  const t = T - sc.start;
  // scene fade in/out
  const fin = clamp(t / 0.45, 0, 1), fout = clamp((sc.dur - t) / 0.4, 0, 1);
  const vis = Math.min(easeOut(fin), sc.last ? 1 : easeOut(fout));
  const card = sc.kind === "card";
  for (const id of ["intro", "outro"]) {
    const el = $(id), on = card && sc.id === id;
    el.style.display = on ? "grid" : "none";
    if (on) {
      const kids = el.querySelectorAll(".in > *");
      kids.forEach((k, i) => { const p = easeOut(clamp((t - 0.15 - i * 0.18) / 0.7, 0, 1));
        k.style.opacity = p * (sc.last ? clamp((sc.dur - t) / 0.8, 0, 1) : fout); k.style.transform = `translateY(${(1 - p) * 30}px)`; });
    }
  }
  $("win").style.display = card ? "none" : "block";
  $("cap").style.display = $("step").style.display = card ? "none" : "block";
  if (card) return;

  $("win").style.opacity = vis;
  $("win").style.transform = `scale(${0.96 + 0.04 * vis})`;

  // shots: current + previous for a short crossfade
  let cur = 0;
  for (let i = 0; i < sc.shots.length; i++) if (t >= sc.shots[i][0]) cur = i;
  const [ts, name, fade = 0.14] = sc.shots[cur];
  const prev = cur > 0 ? sc.shots[cur - 1][1] : null;
  const a = $("a"), b = $("b");
  if (a.dataset.n !== name) { a.src = src(name); a.dataset.n = name; }
  const mix = clamp((t - ts) / fade, 0, 1);
  if (prev && mix < 1) { if (b.dataset.n !== prev) { b.src = src(prev); b.dataset.n = prev; } b.style.display = "block"; b.style.opacity = 1; a.style.opacity = mix; }
  else { b.style.display = "none"; a.style.opacity = 1; }
  b.style.zIndex = 0; a.style.zIndex = 1;

  // camera
  const [fx, fy, z] = interp(sc.cam, t);
  const k = BASE * z;
  const tx = clamp(WW / 2 - fx * k, WW - 1920 * k, 0), ty = clamp(WH / 2 - fy * k, WH - 1080 * k, 0);
  const tf = `translate(${tx}px, ${ty}px) scale(${k})`;
  a.style.transform = b.style.transform = tf;
  const P = (x, y) => [x * k + tx, y * k + ty];

  // drag selection overlay
  const sel = $("sel");
  if (sc.sel && t >= sc.sel.t0 && t < sc.sel.t2) {
    const p = clamp((t - sc.sel.t0) / (sc.sel.t1 - sc.sel.t0), 0, 1);
    const [x0, y0] = P(sc.sel.x0, sc.sel.y), [x1, y1] = P(sc.sel.x0 + (sc.sel.x1 - sc.sel.x0) * ease(p), sc.sel.y + sc.sel.h);
    Object.assign(sel.style, { display: "block", left: x0 + "px", top: y0 + "px", width: (x1 - x0) + "px", height: (y1 - y0) + "px" });
  } else sel.style.display = "none";

  // cursor + click ripples
  const c = $("cursor");
  const cp = sc.cursor && t >= sc.cursor[0][0] - 0.25 ? interp(sc.cursor, t) : null;
  if (cp && !(sc.cursorOff && t > sc.cursorOff)) {
    const [cx, cy] = P(cp[0], cp[1]);
    const appear = clamp((t - (sc.cursor[0][0] - 0.25)) / 0.25, 0, 1);
    const press = (sc.clicks || []).some((ct) => t >= ct && t < ct + 0.09);
    c.style.display = "block"; c.style.opacity = appear * vis;
    c.style.transform = `translate(${cx - 6}px, ${cy - 3}px) scale(${press ? 0.86 : 1})`;
  } else c.style.display = "none";
  for (const r of ripples) r.remove();
  ripples = [];
  for (const ct of sc.clicks || []) {
    const age = t - ct;
    if (age < 0 || age > 0.5) continue;
    const [x, y] = interp(sc.cursor, ct), [cx, cy] = P(x, y);
    const r = document.createElement("div"); r.className = "ripple";
    const p = easeOut(age / 0.5);
    Object.assign(r.style, { left: cx + "px", top: cy + "px", transform: `scale(${0.3 + p * 0.9})`, opacity: 1 - p });
    $("win").appendChild(r); ripples.push(r);
  }

  // caption
  let capText = "";
  for (const [ct, text] of sc.caps) if (t >= ct) capText = text;
  const lastCap = [...sc.caps].reverse().find(([ct]) => t >= ct);
  const cin = lastCap ? easeOut(clamp((t - lastCap[0]) / 0.5, 0, 1)) : 0;
  const span = $("cap").firstChild;
  span.innerHTML = capText;
  span.style.opacity = cin * vis;
  span.style.transform = `translateY(${(1 - cin) * 14}px)`;
  $("step").textContent = sc.step || "";
  $("step").style.opacity = 0.9 * vis;
}
window.setTime = setTime;
window.preload = () => Promise.all(TL.shots.map((n) => new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = src(n); imgs[n] = i; })));
</script>
</body></html>
